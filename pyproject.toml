[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kits"
version = "0.1.0"
description = "KiCad current density and thermal simulation tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "shapely>=2.0", "gmsh>=4.11", "PyYAML", "scikit-fem>=12"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "ruff", "pre-commit"]

[project.scripts]
kits-gui = "kits.gui.app:main"
kits-mesh = "kits.mesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
# D: docstrings (pydocstyle). Ruff only requires them on public objects and only
# checks arguments when an Args: section exists; tools/check_docstrings.py
# (pre-commit + tests) additionally requires them everywhere, with every argument.
select = ["E", "F", "W", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
