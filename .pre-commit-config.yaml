repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-docstrings
        name: check docstrings (all functions, all arguments)
        entry: python tools/check_docstrings.py
        language: python
        types: [python]
        files: ^(src|tools)/
